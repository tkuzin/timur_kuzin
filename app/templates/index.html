<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Служба поддержки — timur_kuzin</title>
<style>*{box-sizing:border-box}body{font:16px system-ui;color:#172439;background:#f3f5f8;margin:0}header{background:#172e58;color:white;padding:20px 5%;display:flex;gap:25px;align-items:center}header a{color:white}main{max-width:1150px;margin:30px auto;padding:0 24px}h1{font-size:28px}h2{font-size:21px}section,.panel{background:white;padding:22px;border:1px solid #dbe1eb;border-radius:9px;margin-bottom:20px}input,select,textarea,button{padding:9px;border:1px solid #a6b4c7;border-radius:5px;font:inherit}button{cursor:pointer;background:#234aa0;color:white}button:disabled{opacity:.4;cursor:default}label{display:block;margin:10px 0}textarea{width:100%;min-height:80px}input[name=title]{width:100%}table{border-collapse:collapse;width:100%;margin:15px 0}th,td{text-align:left;padding:12px;border-bottom:1px solid #dbe1eb}th{background:#edf1f8}a{color:#2453a8}.muted{color:#58667b;font-size:14px}.error{color:#a32424;white-space:pre-wrap}.filters{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.stats{display:flex;gap:20px}.stats section{flex:1}.big{font-size:32px;font-weight:650}.comment{border-left:3px solid #a5badf;padding:8px 15px;margin:14px 0}.body{white-space:pre-wrap}#who{margin-left:auto}details summary{cursor:pointer;font-weight:bold}.badge{background:#edf1f8;padding:4px 8px;border-radius:4px}</style>
<header><strong>Поддержка · timur_kuzin</strong><a href="/">Заявки</a><a id="summary-link" href="/summary">Сводка</a><span id="who"></span><button id="logout">Выйти</button></header>
<main><p id="error" class="error" role="alert"></p><div id="content"></div></main>
<script>
const content=document.querySelector('#content'),err=document.querySelector('#error');
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const names={new:'Новая',in_progress:'В работе',closed:'Закрыта'};let user,categories,page=1;
const date=x=>new Date(x).toLocaleString('ru-RU');
async function api(path,method='GET',data){let r=await fetch('/api'+path,{method,headers:{'Content-Type':'application/json'},...(data?{body:JSON.stringify(data)}:{})});let d=await r.json();if(r.status===401){location.href='/login';throw Error('Требуется вход')}if(!r.ok)throw Error(typeof d.detail==='string'?d.detail:JSON.stringify(d.detail));return d;}
function action(fn){return async e=>{e?.preventDefault();err.textContent='';try{await fn(e)}catch(e){err.textContent=e.message}}}
document.querySelector('#logout').onclick=action(async()=>{await api('/logout','POST');location.href='/login'});
const options=()=>categories.map(c=>`<option value="${c.id}">${esc(c.name)} · ${c.sla_minutes} мин</option>`).join('');
async function list(){content.innerHTML=`<h1>Заявки</h1><section><details><summary>Создать заявку</summary><form id="create"><label>Тема<input name="title" required maxlength="200"></label><label>Категория <select name="category_id">${options()}</select></label><label>Описание<textarea name="body" required maxlength="5000"></textarea></label><button>Отправить заявку</button></form></details></section><section><div class="filters"><label>Статус <select id="status"><option value="">Все</option>${Object.entries(names).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select></label><label>Категория <select id="category"><option value="">Все</option>${options()}</select></label><button id="filter">Показать</button></div><div id="rows"></div><button id="prev">Назад</button> <span id="page"></span> <button id="next">Вперёд</button></section>`;
document.querySelector('#create').onsubmit=action(async e=>{let d=Object.fromEntries(new FormData(e.target));d.category_id=Number(d.category_id);let t=await api('/tickets','POST',d);location.href='/tickets/'+t.id});
document.querySelector('#filter').onclick=action(async()=>{page=1;await rows()});document.querySelector('#prev').onclick=action(async()=>{page--;await rows()});document.querySelector('#next').onclick=action(async()=>{page++;await rows()});await rows();}
async function rows(){let q=new URLSearchParams({page,size:20});let s=document.querySelector('#status').value,c=document.querySelector('#category').value;if(s)q.set('status',s);if(c)q.set('category_id',c);let d=await api('/tickets?'+q);document.querySelector('#rows').innerHTML=`<p class="muted">Найдено заявок: ${d.total}</p><table><thead><tr><th>№</th><th>Тема</th><th>Категория</th><th>Статус</th><th>Создана</th></tr></thead><tbody>${d.items.map(t=>`<tr><td>${t.id}</td><td><a href="/tickets/${t.id}">${esc(t.title)}</a></td><td>${esc(categories.find(c=>c.id===t.category_id)?.name)}</td><td>${names[t.status]}</td><td>${date(t.created_at)}</td></tr>`).join('')}</tbody></table>`;document.querySelector('#page').textContent=`Страница ${page} из ${Math.max(1,Math.ceil(d.total/20))}`;document.querySelector('#prev').disabled=page===1;document.querySelector('#next').disabled=page*20>=d.total;}
async function detail(id){let t=await api('/tickets/'+id);content.innerHTML=`<a href="/">← К списку</a><h1>Заявка № ${t.id}: ${esc(t.title)}</h1><section><p><span class="badge">${names[t.status]}</span> · ${esc(t.category.name)} · ${esc(t.owner)} · ${date(t.created_at)}</p><p class="body">${esc(t.body)}</p><p>Норматив реакции: <b>${t.category.sla_minutes} мин</b>. Первый ответ: <b>${t.reaction_minutes===null?'ещё нет':t.reaction_minutes.toFixed(1)+' мин'}</b>. Норматив: <b>${t.sla_breached?'нарушен':'соблюдён'}</b>.</p>${user.is_staff&&t.status!=='closed'?`<button id="advance">${t.status==='new'?'Взять в работу':'Закрыть заявку'}</button>`:''}</section><section><h2>Переписка</h2>${t.comments.map(c=>`<div class="comment"><b>${esc(c.author)}</b> ${c.is_staff?'· сотрудник':''} <span class="muted">${date(c.created_at)}</span><p class="body">${esc(c.body)}</p></div>`).join('')||'<p>Комментариев пока нет.</p>'}${t.status!=='closed'?'<form id="comment"><label>Ваш комментарий<textarea name="body" required maxlength="5000"></textarea></label><button>Добавить комментарий</button></form>':'<p class="muted">Заявка закрыта.</p>'}</section>`;
if(document.querySelector('#advance'))document.querySelector('#advance').onclick=action(async()=>{await api(`/tickets/${id}/status`,'PATCH',{status:t.status==='new'?'in_progress':'closed'});await detail(id)});if(document.querySelector('#comment'))document.querySelector('#comment').onsubmit=action(async e=>{await api(`/tickets/${id}/comments`,'POST',Object.fromEntries(new FormData(e.target)));await detail(id)});}
async function summary(){content.innerHTML='<h1>Сводка по всем данным</h1><p>Выполняется расчёт…</p>';let d=await api('/summary');content.innerHTML=`<h1>Сводка по всем данным</h1><p class="muted">На ${date(d.as_of)}. Нарушение — первый ответ позже норматива либо норматив истёк, а ответа ещё нет.</p><div class="stats"><section>Всего заявок<div class="big">${d.total.toLocaleString('ru-RU')}</div></section><section>Открытых<div class="big">${d.open.toLocaleString('ru-RU')}</div></section><section>С нарушением норматива<div class="big">${d.breached.toLocaleString('ru-RU')}</div></section></div><section><h2>Показатели по категориям</h2><p class="muted">Доля нарушений рассчитана от всех заявок категории, включая закрытые.</p><table><thead><tr><th>Категория</th><th>Норматив, мин</th><th>Всего</th><th>Открыто</th><th>Нарушено</th><th>Доля нарушений</th></tr></thead><tbody>${d.categories.map(c=>`<tr><td>${esc(c.name)}</td><td>${c.sla_minutes}</td><td>${c.total}</td><td>${c.open}</td><td>${c.breached}</td><td>${(c.breached_share*100).toFixed(1)}%</td></tr>`).join('')}</tbody></table></section>`;}
action(async()=>{user=await api('/me');document.querySelector('#who').textContent=user.username;if(!user.is_staff)document.querySelector('#summary-link').hidden=true;categories=await api('/categories');if(location.pathname==='/summary')await summary();else if(location.pathname.startsWith('/tickets/'))await detail(Number(location.pathname.split('/')[2]));else await list()})();
</script></html>
