<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Вход — timur_kuzin</title>
<style>body{font:17px system-ui;background:#f3f5f8;color:#18243a;max-width:430px;margin:12vh auto;padding:24px}form{background:white;border:1px solid #dbe1eb;border-radius:12px;padding:28px}label{display:block;margin:16px 0}input,button{box-sizing:border-box;width:100%;padding:12px;font:inherit;border:1px solid #aab7cb;border-radius:6px}button{background:#234aa0;color:white;cursor:pointer}#error{color:#a32424}</style>
<h1>Служба поддержки</h1><p>Курсовая работа · timur_kuzin</p><form id="login"><h2>Вход в систему</h2><label>Имя пользователя<input name="username" autocomplete="username" required></label><label>Пароль<input type="password" name="password" autocomplete="current-password" required></label><button>Войти</button><p id="error" role="alert"></p></form>
<script>document.querySelector('form').onsubmit=async e=>{e.preventDefault();let r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});let d=await r.json();if(r.ok)location.href='/';else document.querySelector('#error').textContent=typeof d.detail==='string'?d.detail:'Проверьте поля формы';}</script></html>
